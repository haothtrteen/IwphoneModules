org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8
android.useAndroidX=true
# Android Studio 自带 JDK 25，与模板 Gradle 8.14 不兼容；显式指定 Gradle 使用 JDK 21
org.gradle.java.home=F:\\jdk21\\jdk-21.0.12.1+1
# 注：曾怀疑 Gradle 8.14 + JDK 21 daemon 存在握手死锁，实测 daemon 复用正常
# （gradlew --version 不到 1 秒返回），该问题未复现。daemon 保留开启。
# 若确实遇到 daemon 卡死，临时用 `--no-daemon` 排查，但常态构建不要关，
# 否则每次都要重建 JVM，启动开销无法复用，会明显变慢。

# ---- 构建性能优化 ----
# 本机物理内存 15GB，常驻程序占约 70%。原配置 -Xmx8G + MetaspaceSize=4G
# （合计上限 12G）远超实际可用内存，是构建变慢的主因，故下调堆上限。
#
# 注：2026-09-16 曾因内存被占满导致冷构建挂死（worker 请求 1.51GB 而仅剩 658MB）。
# 那是内存不足所致，不是配置错误。做冷构建前关闭常驻程序即可避免。
# 以下为实测跑通过的配置（冷构建 73s / 增量构建 25s）。
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=4
android.enableJetifier=false

# ---- 代理绕行配置（解决 PKIX path building failed） ----
# 本机 127.0.0.1 上有 HTTP 代理做 TLS 中间人，其自签根证书未导入 JDK 的 cacerts，
# 导致 Gradle Wrapper 下载时 SSL 握手失败。
# 用 nonProxyHosts 放行目标域名即可，不要写空 proxyHost/proxyPort
# （空值会触发 "Invalid https.proxyPort '', using default 443" 警告）。
systemProp.http.nonProxyHosts=127.0.0.1|localhost|mirrors.cloud.tencent.com|*.tencent.com|*.aliyun.com|*.gradle.org|repo1.maven.org|dl.google.com|*.google.com|*.maven.org
systemProp.https.nonProxyHosts=127.0.0.1|localhost|mirrors.cloud.tencent.com|*.tencent.com|*.aliyun.com|*.gradle.org|repo1.maven.org|dl.google.com|*.google.com|*.maven.org
