name: Build modules & deploy site

# 触发条件刻意收窄到"模块/站点/构建脚本"变化：
# 改 Flutter 源码不该触发一次模块重打包 + Pages 部署。
on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "site/**"
      - "tools/build_modules.py"
      - "tools/build_site.py"
      - "modules.catalog.json"
      - ".github/workflows/modules.yml"
  workflow_dispatch:

permissions:
  contents: write      # 回写重建后的 catalog 与 .iwp
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) 打包：modules/<id>/ → modules/<id>/<id>.iwp，并重建 catalog
      - name: Build .iwp packages and catalog
        run: python tools/build_modules.py

      # 2) 把产物提交回仓库，让 raw/镜像 链接也能拿到最新包。
      #    提交信息带 [skip ci]，避免自己触发自己。
      - name: Commit build output
        run: |
          if [ -z "$(git status --porcelain -- modules modules.catalog.json)" ]; then
            echo "构建产物无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules modules.catalog.json
          git commit -m "chore: rebuild modules catalog [skip ci]"
          git push

      # 3) 校验（提交后再确认一次，防止 commit 步骤漏掉东西）
      - name: Verify catalog is up to date
        run: python tools/build_modules.py --check

      # 4) 组装站点：网页 + 清单 + 包放同一站点根，实现同域下载
      - name: Assemble site
        run: python tools/build_site.py --out _site

      # 5) Pages 是否已启用。未启用时只警告、不部署，避免整个 workflow 红掉
      #    （构建产物已经提交回仓库，启用后手动 rerun 即可）。
      - id: pages
        name: Check Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，继续部署"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages 尚未启用（HTTP $code）。请到 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」，然后重跑本 workflow。"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    # Pages 没启用时整个 deploy 跳过：否则 artifact 不存在，job 会红。
    # 构建产物已经在上面提交回仓库了，启用 Pages 后手动跑一次即可补部署。
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
